# Revalidate immutable release artifacts with the current packaging test harness.
# This workflow never builds, retags, uploads, or publishes a release.
name: OA daemon package revalidation
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed tag-push release run with successful native and assemble jobs'
        required: true
        type: string
      release_tag:
        description: 'Existing daemon-vMAJOR.MINOR.PATCH tag built by that run'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
      source_run_id: ${{ steps.verify.outputs.source_run_id }}
      release_tag: ${{ steps.verify.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify source release run and immutable tag
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          OA_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          OA_RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 daemon/scripts/verify-release-revalidation.py source
  packages:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assembled-release
          path: release
          repository: ${{ github.repository }}
          run-id: ${{ needs.source.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify checksums and native source provenance before execution
        env:
          OA_RELEASE_TAG: ${{ needs.source.outputs.release_tag }}
          OA_RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: python3 daemon/scripts/verify-release-revalidation.py artifacts release
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build Nix package and evaluate user services
        run: python3 daemon/scripts/test-nix.py release
      - name: Install and check Homebrew package and user service
        if: runner.os == 'macOS'
        run: python3 daemon/scripts/test-packages.py --artifacts release --homebrew
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478
        if: matrix.runner == 'ubuntu-24.04'
      - name: Install and check Linux Homebrew package
        if: matrix.runner == 'ubuntu-24.04'
        run: python3 daemon/scripts/test-packages.py --artifacts release --homebrew-install
      - name: Build Arch package with makepkg
        if: matrix.runner == 'ubuntu-24.04'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work:ro" archlinux:base-devel bash -euc '
            pacman -Syu --noconfirm python ruby systemd
            useradd --create-home builder
            cp -R /work/release /home/builder/release
            chown -R builder:builder /home/builder/release
            runuser -u builder -- python /work/daemon/scripts/test-packages.py --artifacts /home/builder/release --makepkg
          '
