<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/chat/"><title>Council and Settings — synthetic release checks</title><link rel="stylesheet" href="tailwind.generated.css"><link rel="stylesheet" href="styles.css"><style>body{padding:16px}.fixture-controls{position:fixed;top:0;left:0;right:0;background:#eef2ff;padding:8px;z-index:200;display:flex;gap:8px;flex-wrap:wrap}.fixture-controls button{padding:6px;border:1px solid #aaa}#lanes{margin-top:90px}#fixture-composer{position:fixed;bottom:0;left:10px;right:10px;height:170px;border:1px solid #bbb;background:white;color:#111;border-radius:16px;padding:20px}#result{white-space:pre-wrap} </style></head><body><div class="fixture-controls"><button id="open">Settings</button><button id="memory">Toggle Memory</button><button id="council">Toggle Council</button><button id="errors">Lane error</button><button id="measure">Measure</button><button id="theme">Theme</button><output id="result">Synthetic data only</output></div><main id="lanes"></main><div id="fixture-composer">Composer boundary — settings must stay above here</div><script type="module">
import ChatInput from './components/ChatInput.js';
import { buildMessageHTML } from './components/MessageTemplates.js';
import { showSurface } from './ui/uiMotion.js';
const source = new DOMParser().parseFromString(await (await fetch('index.html')).text(),'text/html');
const menu=document.importNode(source.getElementById('settings-menu'),true);document.body.append(menu);
const component=Object.assign(Object.create(ChatInput.prototype),{app:{elements:{settingsMenu:menu}}});
const children=['memory-settings-children','council-review-children'];
function open(){const bottom=180;Object.assign(menu.style,{position:'fixed',left:`${Math.max(12,(innerWidth-340)/2)}px`,width:`${Math.min(340,innerWidth-24)}px`,top:'auto',bottom:`${bottom}px`,maxHeight:`${innerHeight-bottom-12}px`,overflowY:'auto'});component.settingsMenuAnchor={bottom:menu.style.bottom,maxHeight:menu.style.maxHeight};children.forEach(id=>component.setSettingsChildrenOpen(id,true,{instant:true}));showSurface(menu,'dropdown');}
function toggle(id){const node=document.getElementById(id);component.setSettingsChildrenOpen(id,node.dataset.open!=='true');}
document.getElementById('open').onclick=open;document.getElementById('memory').onclick=()=>toggle(children[0]);document.getElementById('council').onclick=()=>toggle(children[1]);
document.getElementById('measure').onclick=()=>{const r=menu.getBoundingClientRect(),c=document.getElementById('fixture-composer').getBoundingClientRect();document.getElementById('result').textContent=`${r.bottom<=c.top?'PASS':'FAIL'} bottom ${Math.round(r.bottom)} / composer ${Math.round(c.top)}; overflow ${menu.scrollHeight>menu.clientHeight}`;};
document.getElementById('theme').onclick=()=>document.documentElement.classList.toggle('dark');
const image={type:'image_url',image_url:{url:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+aV1sAAAAASUVORK5CYII='}};
let error=false;function render(){document.getElementById('lanes').innerHTML=buildMessageHTML({id:'fixture',role:'assistant',model:'Parallel',content:'',council:{enabled:true,stage1:[{laneId:'primary',label:'Response A',model:'Image',status:'complete',response:'',images:[image]},{laneId:'secondary',label:'Response B',model:'GPT',status:error?'error':'running',response:'Preparing an answer.',stillWorking:!error,error:'Request failed. (HTTP 429)'}]}},{processContentWithLatex:text=>{const el=document.createElement('div');el.textContent=text;return el.innerHTML;},formatTime:()=>''},[],'Image');}
document.getElementById('errors').onclick=()=>{error=!error;render();};render();
</script></body></html>
